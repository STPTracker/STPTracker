/* ================================================================
   AUTH GATE — login / create account / guest, backed by Firebase Auth
   when configured. Every account's data is fully isolated (see
   storeKeyFor() and the Firestore path users/{uid}/data/app above).
   ================================================================ */
let authTab='login';
function showAuthScreen(){
  $('#authScreen').classList.add('show');
  renderAuthForm();
}
function setAuthTab(tab){
  authTab=tab;
  $('#authTabLogin') && $('#authTabLogin').classList.toggle('active',tab==='login');
  $('#authTabSignup') && $('#authTabSignup').classList.toggle('active',tab==='signup');
  renderAuthForm();
}
function renderAuthForm(){
  const area=$('#authFormArea'); if(!area) return;
  $('#authError').textContent='';
  if(authTab==='login'){
    area.innerHTML=`
      <div class="form-group" style="text-align:left;"><label class="form-label">Email</label><input class="form-input" id="authEmail" type="email" placeholder="you@example.com" autocomplete="email"></div>
      <div class="form-group" style="text-align:left;"><label class="form-label">Password</label><input class="form-input" id="authPassword" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn btn-primary btn-block" id="authSubmitBtn" onclick="App.submitLogin()">Log In</button>
    `;
  } else {
    area.innerHTML=`
      <div class="form-group" style="text-align:left;"><label class="form-label">Your Name</label><input class="form-input" id="authName" placeholder="e.g. Priya"></div>
      <div class="form-group" style="text-align:left;"><label class="form-label">Email</label><input class="form-input" id="authEmail" type="email" placeholder="you@example.com" autocomplete="email"></div>
      <div class="form-group" style="text-align:left;"><label class="form-label">Password</label><input class="form-input" id="authPassword" type="password" placeholder="At least 6 characters" autocomplete="new-password"></div>
      <button class="btn btn-primary btn-block" id="authSubmitBtn" onclick="App.submitSignup()">Create Account</button>
    `;
  }
}
function setAuthBusy(busy){
  const btn=$('#authSubmitBtn'); if(!btn) return;
  btn.disabled=busy; btn.style.opacity=busy?'0.6':'1'; btn.textContent=busy? 'Please wait…' : (authTab==='login'?'Log In':'Create Account');
}
function authFail(msg){
  $('#authError').textContent=msg;
  setAuthBusy(false);
}
function friendlyAuthError(e){
  const code=(e&&e.code)||'';
  if(code.includes('email-already-in-use')) return 'That email already has an account — try logging in instead.';
  if(code.includes('invalid-email')) return 'That email address looks invalid.';
  if(code.includes('weak-password')) return 'Password should be at least 6 characters.';
  if(code.includes('user-not-found')||code.includes('wrong-password')||code.includes('invalid-credential')) return 'Incorrect email or password.';
  if(code.includes('too-many-requests')) return 'Too many attempts — please wait a bit and try again.';
  if(code.includes('network-request-failed')) return 'Network error — check your connection and try again.';
  return 'Something went wrong. Please try again.';
}
async function submitSignup(){
  const name=($('#authName').value||'').trim();
  const email=($('#authEmail').value||'').trim();
  const password=$('#authPassword').value||'';
  if(!name){ authFail('Please enter your name.'); return; }
  if(!email || !email.includes('@')){ authFail('Please enter a valid email.'); return; }
  if(password.length<6){ authFail('Password should be at least 6 characters.'); return; }
  if(!(window.__fb && window.__fb.ready)){ authFail('Accounts aren\'t available right now — continue as guest instead.'); return; }
  setAuthBusy(true);
  try{
    const user=await window.__fb.signUp(email,password,name);
    currentUserId=user.uid;
    state=defaultState();
    state.profile.name=name;
    finishBoot();
  }catch(e){ authFail(friendlyAuthError(e)); }
}
async function submitLogin(){
  const email=($('#authEmail').value||'').trim();
  const password=$('#authPassword').value||'';
  if(!email || !password){ authFail('Please enter your email and password.'); return; }
  if(!(window.__fb && window.__fb.ready)){ authFail('Accounts aren\'t available right now — continue as guest instead.'); return; }
  setAuthBusy(true);
  try{
    const user=await window.__fb.logIn(email,password);
    await signInUser(user);
  }catch(e){ authFail(friendlyAuthError(e)); }
}
function continueAsGuest(){
  currentUserId='guest';
  state=load();
  finishBoot();
}
async function signOutUser(){
  if(!confirm('Log out? Your data is saved to your account and will be here next time you log in.')) return;
  try{ if(window.__fb && window.__fb.ready && window.__fb.user) await window.__fb.logOut(); }catch(e){ console.error(e); }
  handleSignedOut();
}
function handleSignedOut(){
  appBooted=false;
  currentUserId='guest';
  closeSheet();
  $('#appShell').style.display='none';
  $('#fabBtn').style.display='none';
  $('#bottomNav').style.display='none';
  $('#onboardScreen').classList.remove('show');
  setAuthTab('login');
  showAuthScreen();
}

/* ================================================================
   ONBOARDING — asks the essentials once per account: name, daily
   targets, and exam dates (same fields as Settings), then drops the
   person straight into a ready-to-use Home screen.
   ================================================================ */
let onboardStep=0;
const ONBOARD_STEPS=['welcome','name','targets','exams','done'];
function showOnboarding(){
  onboardStep=0;
  $('#onboardScreen').classList.add('show');
  renderOnboardStep();
}
function onboardDots(){
  return `<div class="onboard-dots">${ONBOARD_STEPS.map((s,i)=>`<div class="onboard-dot ${i===onboardStep?'active':i<onboardStep?'done':''}"></div>`).join('')}</div>`;
}
function renderOnboardStep(){
  const el=$('#onboardContent'); if(!el) return;
  const step=ONBOARD_STEPS[onboardStep];
  let html=onboardDots();
  if(step==='welcome'){
    html+=`
      <div class="onboard-step">
        <div class="onboard-emoji">🚀</div>
        <div class="gate-title">Welcome to Ascent</div>
        <div class="gate-sub">Let's set things up — this takes less than a minute, and you can change any of it later in Settings.</div>
        <button class="btn btn-primary btn-block" onclick="App.onboardNext()">Let's go</button>
      </div>`;
  } else if(step==='name'){
    html+=`
      <div class="onboard-step">
        <div class="onboard-emoji">👋</div>
        <div class="gate-title">What should we call you?</div>
        <div class="gate-sub">This shows up in your daily greeting.</div>
        <div class="form-group" style="text-align:left;"><input class="form-input" id="obName" placeholder="Your name" value="${esc(state.profile.name||'')}"></div>
        <button class="btn btn-primary btn-block" onclick="App.onboardSaveName()">Continue</button>
      </div>`;
  } else if(step==='targets'){
    html+=`
      <div class="onboard-step">
        <div class="onboard-emoji">🎯</div>
        <div class="gate-title">Set your daily targets</div>
        <div class="gate-sub">Defaults work well for most students — tweak if you already know your pace.</div>
        <div class="form-row">
          <div class="form-group" style="text-align:left;"><label class="form-label">Daily Study (min)</label><input type="number" class="form-input" id="obStudy" value="${state.profile.dailyStudyTarget}"></div>
          <div class="form-group" style="text-align:left;"><label class="form-label">Daily MCQs</label><input type="number" class="form-input" id="obMcq" value="${state.profile.dailyMcqTarget}"></div>
        </div>
        <button class="btn btn-primary btn-block" onclick="App.onboardSaveTargets()">Continue</button>
      </div>`;
  } else if(step==='exams'){
    const e=state.examDates;
    html+=`
      <div class="onboard-step">
        <div class="onboard-emoji">📅</div>
        <div class="gate-title">Confirm your exam dates</div>
        <div class="gate-sub">Estimates are fine for now — edit anytime once official dates are out.</div>
        <div class="form-group" style="text-align:left;"><label class="form-label">${esc(e.cet1.label)}</label><input type="date" class="form-input" id="obCet1" value="${e.cet1.date}"></div>
        <div class="form-group" style="text-align:left;"><label class="form-label">${esc(e.hsc.label)}</label><input type="date" class="form-input" id="obHsc" value="${e.hsc.date}"></div>
        <div class="form-group" style="text-align:left;"><label class="form-label">${esc(e.cet2.label)}</label><input type="date" class="form-input" id="obCet2" value="${e.cet2.date}"></div>
        <button class="btn btn-primary btn-block" onclick="App.onboardSaveExams()">Continue</button>
      </div>`;
  } else if(step==='done'){
    html+=`
      <div class="onboard-step">
        <div class="onboard-emoji">🎉</div>
        <div class="gate-title">All set, ${esc(state.profile.name||'there')}!</div>
        <div class="gate-sub">Want a look around with some sample data filled in, or would you rather start with a clean slate?</div>
        <button class="btn btn-primary btn-block" onclick="App.onboardFinish(true)" style="margin-bottom:10px;">✨ Add Demo Data (recommended)</button>
        <button class="btn btn-block" onclick="App.onboardFinish(false)">Start Fresh</button>
      </div>`;
  }
  el.innerHTML=html;
}
function onboardNext(){ onboardStep=Math.min(ONBOARD_STEPS.length-1,onboardStep+1); renderOnboardStep(); }
function onboardSaveName(){
  const name=($('#obName').value||'').trim();
  if(!name){ toast('Please enter a name','⚠️'); return; }
  state.profile.name=name; save(); onboardNext();
}
function onboardSaveTargets(){
  state.profile.dailyStudyTarget=clamp(Number($('#obStudy').value)||120,10,600);
  state.profile.dailyMcqTarget=clamp(Number($('#obMcq').value)||50,5,500);
  state.profile.weeklyStudyTarget=state.profile.dailyStudyTarget*7;
  state.profile.weeklyMcqTarget=state.profile.dailyMcqTarget*7;
  save(); onboardNext();
}
function onboardSaveExams(){
  state.examDates.cet1.date=$('#obCet1').value||state.examDates.cet1.date;
  state.examDates.hsc.date=$('#obHsc').value||state.examDates.hsc.date;
  state.examDates.cet2.date=$('#obCet2').value||state.examDates.cet2.date;
  save(); onboardNext();
}
function onboardFinish(wantsDemo){
  state.onboarded=true;
  save();
  revealApp();
  setTimeout(()=>{
    fireConfetti();
    if(wantsDemo) seedDemoData();
    else toast('Welcome aboard — let\'s get studying','🚀');
  },300);
}
