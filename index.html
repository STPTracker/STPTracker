<style>
/* Login / onboarding */
.auth-screen{position:fixed;inset:0;z-index:300;background:var(--bg-0);display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;}
.auth-screen.hidden{display:none;}
.auth-card{width:100%;max-width:400px;animation:pageIn .5s cubic-bezier(.16,1,.3,1);}
.auth-logo{text-align:center;margin-bottom:28px;}
.auth-logo .mark{width:64px;height:64px;border-radius:18px;background:var(--grad-primary);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#0a0b12;font-size:28px;box-shadow:0 12px 36px rgba(124,156,255,.45);animation:pulseGlow 2.5s ease-in-out infinite;}
@keyframes pulseGlow{0%,100%{box-shadow:0 12px 36px rgba(124,156,255,.35);}50%{box-shadow:0 12px 48px rgba(124,156,255,.6);}}
.auth-logo h1{font-size:28px;margin-top:14px;}
.auth-logo p{color:var(--text-2);font-size:13px;margin-top:4px;}
.fade-up{animation:fadeUp .45s cubic-bezier(.16,1,.3,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.stagger-1{animation-delay:.08s}.stagger-2{animation-delay:.16s}.stagger-3{animation-delay:.24s}.stagger-4{animation-delay:.32s}
.card.enter{animation:cardIn .4s cubic-bezier(.16,1,.3,1) both;}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.98);}to{opacity:1;transform:none;}}

/* ============================================================
   ASCENT — Liquid Glass Design System
   ============================================================ */
:root{
  --bg-0:#05060c;
  --bg-1:#0a0d18;
  --bg-2:#0e1220;
  --glass:rgba(255,255,255,0.03);
  --glass-hi:rgba(255,255,255,0.06);
  --glass-border:rgba(255,255,255,0.07);
  --glass-border-hi:rgba(255,255,255,0.14);
  --glass-blur:28px;
  --glass-sat:220%;
  --text-0:#f5f6fa;
  --text-1:#c7cad6;
  --text-2:#8b8fa3;
  --text-3:#5c6079;
  --accent-1:#7c9cff;
  --accent-2:#86e3ce;
  --accent-3:#c792ea;
  --amber:#ffb86b;
  --rose:#ff7593;
  --green:#7ee0b8;
  --grad-primary:linear-gradient(135deg,#7c9cff 0%,#8b7bff 45%,#c792ea 100%);
  --grad-mint:linear-gradient(135deg,#63e6d4 0%,#7c9cff 100%);
  --grad-warm:linear-gradient(135deg,#ffb86b 0%,#ff7593 100%);
  --radius-xl:28px;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:11px;
  --shadow-1:0 8px 32px rgba(0,0,0,0.35);
  --shadow-2:0 20px 60px rgba(0,0,0,0.45);
  --nav-h:78px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  color-scheme: dark;
}
[data-theme="light"]{
  --bg-0:#eef0f7;
  --bg-1:#e7eaf4;
  --bg-2:#dfe3f0;
  --glass:rgba(255,255,255,0.28);
  --glass-hi:rgba(255,255,255,0.42);
  --glass-border:rgba(20,25,50,0.09);
  --glass-border-hi:rgba(20,25,50,0.16);
  --text-0:#161826;
  --text-1:#3a3d52;
  --text-2:#6b6f87;
  --text-3:#9598ab;
  --shadow-1:0 8px 32px rgba(30,35,70,0.10);
  --shadow-2:0 20px 60px rgba(30,35,70,0.14);
  color-scheme: light;
}
/* ---------- Accent Themes (Gen-Z color picker) ---------- */
[data-accent="default"]{
  --accent-1:#7c9cff;--accent-2:#86e3ce;--accent-3:#c792ea;
  --grad-primary:linear-gradient(135deg,#7c9cff 0%,#8b7bff 45%,#c792ea 100%);
  --grad-mint:linear-gradient(135deg,#63e6d4 0%,#7c9cff 100%);
  --orb-a:#7c9cff;--orb-b:#c792ea;--orb-c:#63e6d4;
}
[data-accent="sunset"]{
  --accent-1:#ff8a65;--accent-2:#ffd479;--accent-3:#ff6ea8;
  --grad-primary:linear-gradient(135deg,#ff8a65 0%,#ff6ea8 55%,#c264ff 100%);
  --grad-mint:linear-gradient(135deg,#ffd479 0%,#ff8a65 100%);
  --orb-a:#ff8a65;--orb-b:#ff6ea8;--orb-c:#ffd479;
}
[data-accent="aurora"]{
  --accent-1:#5ee6c9;--accent-2:#6ea8ff;--accent-3:#a685ff;
  --grad-primary:linear-gradient(135deg,#5ee6c9 0%,#6ea8ff 55%,#a685ff 100%);
  --grad-mint:linear-gradient(135deg,#5ee6c9 0%,#6ea8ff 100%);
  --orb-a:#5ee6c9;--orb-b:#6ea8ff;--orb-c:#a685ff;
}
[data-accent="bubblegum"]{
  --accent-1:#ff7ac6;--accent-2:#ffb3e0;--accent-3:#b98bff;
  --grad-primary:linear-gradient(135deg,#ff7ac6 0%,#c78bff 55%,#8ea6ff 100%);
  --grad-mint:linear-gradient(135deg,#ffb3e0 0%,#ff7ac6 100%);
  --orb-a:#ff7ac6;--orb-b:#b98bff;--orb-c:#ffb3e0;
}
[data-accent="mint"]{
  --accent-1:#4fe8b0;--accent-2:#8fffd6;--accent-3:#5ecbff;
  --grad-primary:linear-gradient(135deg,#4fe8b0 0%,#5ecbff 60%,#7c9cff 100%);
  --grad-mint:linear-gradient(135deg,#8fffd6 0%,#4fe8b0 100%);
  --orb-a:#4fe8b0;--orb-b:#5ecbff;--orb-c:#8fffd6;
}
[data-accent="galaxy"]{
  --accent-1:#a78bff;--accent-2:#ff8bd8;--accent-3:#7c9cff;
  --grad-primary:linear-gradient(135deg,#7c9cff 0%,#a78bff 45%,#ff8bd8 100%);
  --grad-mint:linear-gradient(135deg,#ff8bd8 0%,#a78bff 100%);
  --orb-a:#a78bff;--orb-b:#ff8bd8;--orb-c:#7c9cff;
}
/* ============================================================
   NEUMORPHISM SURFACE MODE — soft UI, solid matte, dual-shadow depth
   Toggle via [data-surface="neuro"] on <html>. Liquid Glass ([data-surface="glass"])
   remains fully intact and switchable in Settings → Appearance.
   ============================================================ */
[data-surface="neuro"]{
  --bg-0:#1c1f28; --bg-1:#20232c; --bg-2:#242833;
  --neuro-base:#242833;
  --neuro-light:rgba(255,255,255,0.055);
  --neuro-dark:rgba(0,0,0,0.5);
  --glass-border:rgba(255,255,255,0.045);
  --glass-border-hi:rgba(255,255,255,0.09);
}
[data-surface="neuro"][data-theme="light"]{
  --bg-0:#e7ebf3; --bg-1:#eaeef5; --bg-2:#edf1f7;
  --neuro-base:#edf1f7;
  --neuro-light:rgba(255,255,255,0.95);
  --neuro-dark:rgba(163,177,198,0.5);
  --glass-border:rgba(20,25,50,0.05);
  --glass-border-hi:rgba(20,25,50,0.1);
}
[data-surface="neuro"] body{background:var(--bg-0);}
[data-surface="neuro"] .bg-orbs{opacity:0;}
[data-surface="neuro"] .card{
  background:var(--neuro-base); border:none;
  backdrop-filter:none!important; -webkit-backdrop-filter:none!important;
  box-shadow:8px 8px 18px var(--neuro-dark), -8px -8px 18px var(--neuro-light);
}
[data-surface="neuro"] .card::before,[data-surface="neuro"] .card::after{display:none;}
[data-surface="neuro"] .card.tap:active{box-shadow:inset 5px 5px 11px var(--neuro-dark), inset -5px -5px 11px var(--neuro-light);transform:scale(0.98);}
[data-surface="neuro"] .card-sm{box-shadow:6px 6px 13px var(--neuro-dark), -6px -6px 13px var(--neuro-light);}
[data-surface="neuro"] .card.accent-glow{box-shadow:6px 6px 16px color-mix(in srgb, var(--accent-1) 30%, transparent), -6px -6px 14px var(--neuro-light);}
[data-surface="neuro"] .btn{
  background:var(--neuro-base); border:none; color:var(--text-0);
  box-shadow:5px 5px 11px var(--neuro-dark), -5px -5px 11px var(--neuro-light);
}
[data-surface="neuro"] .btn:active{box-shadow:inset 3px 3px 7px var(--neuro-dark), inset -3px -3px 7px var(--neuro-light);}
[data-surface="neuro"] .btn-primary{background:var(--grad-primary);color:#0a0b14;box-shadow:5px 5px 14px color-mix(in srgb, var(--accent-1) 45%, transparent), -4px -4px 10px var(--neuro-light);}
[data-surface="neuro"] .btn-danger{box-shadow:5px 5px 14px rgba(255,90,120,0.35), -4px -4px 10px var(--neuro-light);}
[data-surface="neuro"] .form-input,[data-surface="neuro"] .form-select,[data-surface="neuro"] .form-textarea{
  background:var(--neuro-base); border:none;
  box-shadow:inset 4px 4px 9px var(--neuro-dark), inset -4px -4px 9px var(--neuro-light);
}
[data-surface="neuro"] .chip,[data-surface="neuro"] .tab-btn,[data-surface="neuro"] .mood-chip,[data-surface="neuro"] .swatch{
  background:var(--neuro-base); border:none;
  box-shadow:4px 4px 9px var(--neuro-dark), -4px -4px 9px var(--neuro-light);
}
[data-surface="neuro"] .chip.active,[data-surface="neuro"] .tab-btn.active,[data-surface="neuro"] .mood-chip.active{
  box-shadow:inset 3px 3px 7px rgba(0,0,0,0.3), inset -2px -2px 6px rgba(255,255,255,0.07);
}
[data-surface="neuro"] .bottom-nav{background:var(--neuro-base);backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-top:none;box-shadow:0 -6px 18px var(--neuro-dark);}
[data-surface="neuro"] .sheet{background:var(--neuro-base);backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:none;box-shadow:0 -10px 32px rgba(0,0,0,0.4), inset 0 1px 0 var(--neuro-light);}
[data-surface="neuro"] .topbar{background:var(--bg-0);backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-bottom:1px solid var(--glass-border);}
[data-surface="neuro"] .progress-track{box-shadow:inset 2px 2px 5px var(--neuro-dark), inset -2px -2px 5px var(--neuro-light);background:transparent;}
[data-surface="neuro"] .level-badge,[data-surface="neuro"] .fab{box-shadow:6px 6px 15px color-mix(in srgb, var(--accent-1) 35%, transparent), -4px -4px 10px var(--neuro-light);}
[data-surface="neuro"] .search-bar,[data-surface="neuro"] .quote-card{background:var(--neuro-base);box-shadow:inset 3px 3px 8px var(--neuro-dark), inset -3px -3px 8px var(--neuro-light);}
[data-surface="neuro"] .badge{box-shadow:2px 2px 5px var(--neuro-dark), -2px -2px 5px var(--neuro-light);}
[data-surface="neuro"] .side-item.active{box-shadow:inset 3px 3px 7px var(--neuro-dark), inset -2px -2px 6px var(--neuro-light);background:var(--neuro-base);}
[data-surface="neuro"] .heat-cell{box-shadow:1px 1px 2px var(--neuro-dark);}
[data-surface="neuro"] .toast{background:var(--neuro-base);backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:5px 5px 14px rgba(0,0,0,0.4), -4px -4px 10px var(--neuro-light);color:var(--text-0);}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",Roboto,sans-serif;
  background:var(--bg-0);
  color:var(--text-0);
  overflow-x:hidden;
  min-height:100vh;
  transition:background .4s ease,color .4s ease;
}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:10px;}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.12);}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-0.02em;}
p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}
.tabular{font-variant-numeric:tabular-nums;}

/* ---------- Animated background orbs ---------- */
.bg-orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;transition:filter .6s;}
.orb{position:absolute;border-radius:50%;filter:blur(85px);opacity:.62;will-change:transform;transition:background 1.2s ease;}
.orb1{width:460px;height:460px;background:radial-gradient(circle,var(--orb-a,#7c9cff),transparent 68%);top:-150px;left:-130px;animation:float1 22s ease-in-out infinite;}
.orb2{width:420px;height:420px;background:radial-gradient(circle,var(--orb-b,#c792ea),transparent 68%);bottom:-170px;right:-110px;animation:float2 26s ease-in-out infinite;}
.orb3{width:340px;height:340px;background:radial-gradient(circle,var(--orb-c,#63e6d4),transparent 68%);top:38%;right:8%;animation:float3 30s ease-in-out infinite;}
.orb4{width:280px;height:280px;background:radial-gradient(circle,var(--orb-a,#7c9cff),transparent 68%);top:62%;left:6%;opacity:.4;animation:float4 34s ease-in-out infinite;}
.orb5{width:220px;height:220px;background:radial-gradient(circle,var(--orb-b,#c792ea),transparent 68%);top:8%;right:28%;opacity:.36;animation:float5 24s ease-in-out infinite;}
[data-theme="light"] .orb{opacity:.4;}
[data-theme="light"] .orb4,[data-theme="light"] .orb5{opacity:.26;}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(60px,80px) scale(1.15);}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-70px,-50px) scale(1.1);}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-40px,60px) scale(0.9);}}
@keyframes float4{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(50px,-40px) scale(1.2);}}
@keyframes float5{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,50px) scale(0.85);}}
@media (prefers-reduced-motion:reduce){.orb{animation:none!important;}}

/* ---------- Layout shell ---------- */
.app-shell{position:relative;z-index:1;display:flex;min-height:100vh;}
.sidebar{
  display:none;
  width:264px;flex-shrink:0;
  padding:28px 16px;
  position:sticky;top:0;height:100vh;
  flex-direction:column;gap:6px;
}
.side-brand{display:flex;align-items:center;gap:10px;padding:6px 12px 22px;}
.side-brand .mark{width:34px;height:34px;border-radius:10px;background:var(--grad-primary);display:flex;align-items:center;justify-content:center;font-weight:800;color:#0a0b12;font-size:15px;box-shadow:0 6px 18px rgba(124,156,255,.4);}
.side-brand .word{font-size:18px;font-weight:800;letter-spacing:-0.02em;}
.side-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;
  color:var(--text-2);font-size:14.5px;font-weight:600;cursor:pointer;
  transition:background .2s,color .2s,transform .15s;
  border:1px solid transparent;
}
.side-item .ic{font-size:17px;width:22px;text-align:center;}
.side-item:hover{background:var(--glass);color:var(--text-0);}
.side-item.active{background:var(--glass-hi);color:var(--text-0);border-color:var(--glass-border-hi);box-shadow:var(--shadow-1);}
.side-foot{margin-top:auto;padding:12px;font-size:11.5px;color:var(--text-3);}

.main-col{flex:1;min-width:0;}
.topbar{
  display:none;
  align-items:center;justify-content:space-between;
  padding:20px 32px;position:sticky;top:0;z-index:20;
  backdrop-filter:blur(24px) saturate(200%);-webkit-backdrop-filter:blur(24px) saturate(200%);
  background:color-mix(in srgb, var(--bg-0) 45%, transparent);
  border-bottom:1px solid var(--glass-border);
}
.topbar h2{font-size:20px;}
.content{
  padding:16px 16px calc(var(--nav-h) + 24px + var(--safe-b));
  max-width:1160px;margin:0 auto;
  min-height:100vh;
}
@media(min-width:900px){
  .sidebar{display:flex;}
  .topbar{display:flex;}
  .content{padding:24px 32px 48px;}
}

/* ---------- Mobile top header ---------- */
.mobile-header{
  padding:calc(14px + var(--safe-t)) 18px 8px;
  display:flex;align-items:center;justify-content:space-between;
}
@media(min-width:900px){.mobile-header{display:none;}}
.mobile-header .greet{font-size:22px;font-weight:800;}
.mobile-header .sub{color:var(--text-2);font-size:13px;margin-top:2px;}
.header-btn{
  width:40px;height:40px;border-radius:13px;background:var(--glass);border:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text-0);cursor:pointer;
}

/* ---------- Glass card ---------- */
.card{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  box-shadow:var(--shadow-1), inset 0 1px 0 rgba(255,255,255,0.20), inset 0 0 22px rgba(255,255,255,0.025), inset 0 -1px 0 rgba(255,255,255,0.03);
  padding:18px;
  position:relative;
  overflow:hidden;
  transition:transform .3s cubic-bezier(.2,.9,.25,1),box-shadow .3s,border-color .3s,background .3s;
}
.card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(160deg,rgba(255,255,255,0.32),rgba(255,255,255,0) 35%,rgba(255,255,255,0) 70%,rgba(255,255,255,0.08) 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.card::after{
  content:'';position:absolute;top:0;left:6%;right:6%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.65),transparent);
  pointer-events:none;opacity:.8;
}
[data-theme="light"] .card::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,0.95),transparent);}
[data-theme="light"] .card{box-shadow:var(--shadow-1), inset 0 1px 0 rgba(255,255,255,0.7), inset 0 0 22px rgba(255,255,255,0.15);}
.card.tap{cursor:pointer;}
.card.tap:active{transform:scale(0.965);}
@media(hover:hover){.card.tap:hover{border-color:var(--glass-border-hi);box-shadow:var(--shadow-2), inset 0 1px 0 rgba(255,255,255,0.24);}}
.card.accent-glow{box-shadow:var(--shadow-1), 0 0 0 1px color-mix(in srgb, var(--accent-1) 30%, transparent), inset 0 1px 0 rgba(255,255,255,0.2);}
.card-sm{padding:14px;border-radius:var(--radius-md);}
.section{margin-bottom:22px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 2px;}
.section-head h3{font-size:15.5px;color:var(--text-1);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
.section-head .link{font-size:13px;color:var(--accent-1);font-weight:600;cursor:pointer;}
.grid{display:grid;gap:12px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:560px){.grid-3{grid-template-columns:1fr 1fr;}.grid-4{grid-template-columns:1fr 1fr;}}
@media(min-width:900px){.grid-auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:14px;border:1px solid var(--glass-border);
  background:var(--glass);color:var(--text-0);font-size:14px;font-weight:700;
  cursor:pointer;transition:transform .15s,box-shadow .2s,filter .2s,background .2s;
  user-select:none;white-space:nowrap;
}
.btn:active{transform:scale(0.96);}
.btn-primary{background:var(--grad-primary);color:#0a0b14;border:none;box-shadow:0 8px 24px rgba(124,156,255,.35);}
.btn-primary:active{filter:brightness(0.92);}
.btn-ghost{background:transparent;}
.btn-danger{background:linear-gradient(135deg,#ff7593,#ff4d6d);color:#1a0508;border:none;}
.btn-sm{padding:8px 13px;font-size:12.5px;border-radius:11px;}
.btn-block{width:100%;}
.btn-icon{width:42px;height:42px;padding:0;border-radius:13px;font-size:17px;flex-shrink:0;}
.fab{

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;

  box-shadow:0 -1px 0 rgba(255,255,255,0.04) inset;
}
@media(min-width:900px){.bottom-nav{display:none;}}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-3);font-size:10.5px;font-weight:600;cursor:pointer;transition:color .2s;position:relative;
}
.nav-item .ic{font-size:21px;transition:transform .2s;}
.nav-item.active{color:var(--accent-1);}
.nav-item.active .ic{transform:translateY(-2px);}
.nav-item:active .ic{transform:scale(0.85);}

/* ---------- Bottom sheet / modal ---------- */
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:90;opacity:0;pointer-events:none;
  transition:opacity .25s;backdrop-filter:blur(2px);
}
.sheet-backdrop.show{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:91;
  max-height:88vh;overflow-y:auto;
  background:color-mix(in srgb, var(--bg-1) 62%, transparent);
  backdrop-filter:blur(34px) saturate(220%);-webkit-backdrop-filter:blur(34px) saturate(220%);
  border-radius:26px 26px 0 0;
  border:1px solid var(--glass-border-hi);border-bottom:none;
  padding:10px 18px calc(24px + var(--safe-b));
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.85,.2,1);
  box-shadow:0 -20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.14);
}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:40px;height:5px;border-radius:4px;background:var(--text-3);opacity:.4;margin:8px auto 14px;}
.sheet-title{font-size:19px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
@media(min-width:640px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-46%) scale(0.94);opacity:0;width:520px;max-width:92vw;border-radius:26px;max-height:85vh;}
  .sheet.show{transform:translate(-50%,-50%) scale(1);opacity:1;}
  .sheet-handle{display:none;}
}
.form-group{margin-bottom:14px;}
.form-label{font-size:12.5px;color:var(--text-2);font-weight:700;margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.04em;}
.form-input,.form-select,.form-textarea{

}
[data-theme="light"] .form-input,[data-theme="light"] .form-select,[data-theme="light"] .form-textarea{background:rgba(0,0,0,0.03);}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent-1);background:rgba(124,156,255,0.07);}

}

/* ---------- Misc components ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(255,255,255,0.06);color:var(--text-2);}
.badge.red{background:rgba(255,117,147,.14);color:var(--rose);}

.toast{

::placeholder{color:var(--text-3);}

/* ---------- XP / Level ---------- */
.xp-row{display:flex;align-items:center;gap:12px;}
.level-badge{
  width:46px;height:46px;border-radius:15px;background:var(--grad-primary);flex-shrink:0;

}
.xp-track{height:10px;border-radius:8px;background:rgba(255,255,255,0.07);overflow:hidden;position:relative;flex:1;}

.xp-fill{height:100%;border-radius:8px;background:var(--grad-primary);transition:width .6s cubic-bezier(.2,.8,.2,1);position:relative;}
.xp-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.35),transparent);}

/* ---------- Accent swatches ---------- */
.swatch-row{display:flex;flex-wrap:wrap;gap:12px;}
.swatch{width:52px;height:52px;border-radius:16px;cursor:pointer;position:relative;border:2px solid transparent;transition:transform .2s,border-color .2s;flex-shrink:0;}
.swatch:active{transform:scale(0.9);}
.swatch.active{border-color:var(--text-0);}
.swatch.active::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.5);}
.swatch-label{font-size:10px;color:var(--text-2);text-align:center;margin-top:5px;font-weight:600;}

/* ---------- Quote / vibe card ---------- */
.quote-card{padding:20px 18px;position:relative;}
.quote-card .qmark{font-size:34px;opacity:.35;line-height:0.6;font-weight:800;}
.quote-card .qtext{font-size:14.5px;font-weight:700;line-height:1.5;margin-top:6px;}
.quote-card .qauth{font-size:11.5px;color:var(--text-2);margin-top:8px;}

.freeze-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;background:rgba(94,203,255,0.14);color:#8fd8ff;font-size:11px;font-weight:700;}

/* ---------- Mood chips ---------- */
.mood-row{display:flex;justify-content:space-between;gap:6px;}
.mood-chip{flex:1;text-align:center;padding:10px 4px;border-radius:13px;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);font-size:22px;cursor:pointer;transition:all .18s;}
.mood-chip.active{background:var(--grad-primary);transform:scale(1.06);box-shadow:0 6px 16px color-mix(in srgb, var(--accent-1) 40%, transparent);}

/* ---------- Personal bests grid ---------- */
.best-item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--glass-border);}
.best-item:last-child{border-bottom:none;}
.best-item .ic{width:38px;height:38px;border-radius:12px;background:var(--glass-hi);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}

/* ---------- Focus Mode (Pomodoro) ---------- */
.focus-lock{
  position:fixed;inset:0;z-index:150;background:var(--bg-0);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
.focus-lock.show{display:flex;animation:pageIn .4s cubic-bezier(.16,1,.3,1);}
.focus-lock .fl-orbwrap{position:absolute;inset:0;overflow:hidden;z-index:0;}

.focus-lock .fl-time{font-size:min(20vw,88px);font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;margin:6px 0 18px;}
.focus-ring{margin:0 auto 20px;}
.focus-lock .fl-sub{font-size:13.5px;color:var(--text-2);margin-bottom:26px;}
.focus-lock .fl-controls{display:flex;gap:12px;justify-content:center;}
.focus-lock .fl-close{position:absolute;top:calc(18px + var(--safe-t));right:18px;z-index:2;}
.pip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-border);font-size:12px;font-weight:700;margin-bottom:16px;}

/* ---------- Confetti canvas ---------- */

/* ---------- Share card ---------- */
.share-preview{border-radius:20px;overflow:hidden;width:100%;box-shadow:var(--shadow-2);}
</style>
</head>

<script>
(function(){
"use strict";
/* ============================================================
   ASCENT — Single-file academic command center
   ============================================================ */

/* ---------------- Utilities ---------------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const uid=()=> Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtDate=(iso,opts)=>{ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-IN',opts||{day:'numeric',month:'short',year:'numeric'}); };
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pct=(a,b)=>b>0?Math.round((a/b)*100):0;
const esc=(s)=> (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function minToHm(min){ min=Math.round(min||0); const h=Math.floor(min/60), m=min%60; return h>0?(h+'h '+m+'m'):(m+'m'); }
function secToClock(s){ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; return [h,m,sec].map((v,i)=> i===0? String(v).padStart(2,'0'): String(v).padStart(2,'0')).join(':'); }
function toast(msg,emoji){
  const wrap=$('#toastWrap'); const t=document.createElement('div'); t.className='toast';
  t.innerHTML=`<span>${emoji||'✅'}</span><span>${esc(msg)}</span>`; wrap.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); },2600);
}
function weekStart(d){ const dt=new Date(d); const day=dt.getDay(); const diff=(day===0? -6:1)-day; dt.setDate(dt.getDate()+diff); dt.setHours(0,0,0,0); return dt; }
function isoDaysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ---------------- Default Data / State ---------------- */
const DEFAULT_COLORS=['#7c9cff','#86e3ce','#c792ea','#ffb86b','#ff7593','#7ee0b8','#ffd479','#a0c4ff'];
const ACTIVITY_TYPES=['Concept Learning','MCQs','PYQs','Revision','Formula Revision','Notes','Test','Error Analysis','Board Writing','Practical','Homework','Assignment','Basics'];
const TASK_CATEGORIES=['College','Tuition','CET','HSC','CS1','CS2','Personal'];
const MISTAKE_CATEGORIES=['Conceptual mistake','Calculation mistake','Formula mistake','Silly mistake','Misread question','Time pressure','Guessing'];

function defaultSubjects(){
  function mk(name,icon,category,color,chapters,foundation){
    return {id:uid(),name,icon,category,color,targetHours:80,targetDate:'',priority:'High',
      chapters:(chapters||[]).map(c=>mkChapter(c)),
      foundationTopics:(foundation||[]).map(t=>({id:uid(),name:t,done:false}))};
  }
  function mkChapter(name){
    return {id:uid(),name,priority:'Medium',targetDate:'',estHours:6,difficulty:'Medium',
      status:'Not Started',collegeStatus:'Not Started',tuitionStatus:'Not Started',notes:'',
      revision:{level:0,confidence:0,lastRevised:'',nextRevision:'',history:[]},
      testStatus:'Not Started',topics:[]};
  }
  return [
    // --- Maths Part 1 (from your book's index: Sr 1–7) ---
    mk('Maths Part 1','∑','Both',DEFAULT_COLORS[0],
      ['Mathematical Logic','Matrices','Trigonometric Functions','Pair of Straight Lines','Vectors','Line and Plane','Linear Programming'],
      ['Algebra basics','Logarithms','Quadratic equations','Sets & functions','Trigonometric ratios','Coordinate geometry basics']),
    // --- Maths Part 2 (from your book's index: Sr 1–8) ---
    mk('Maths Part 2','∫','Both',DEFAULT_COLORS[7],
      ['Differentiation','Applications of Derivatives','Indefinite Integration','Definite Integration','Application of Definite Integration','Differential Equations','Probability Distributions','Binomial Distribution'],
      ['Limits & continuity basics','Functions recap','Basic integration rules','Permutations & combinations']),

/* Productivity score (visible & tweakable via constants below) */
const PROD_WEIGHTS={study:35,mcq:25,revision:15,tasks:15,tests:10};
function productivityScoreFor(dateStr){
  const sess=state.sessions.filter(s=>s.date===dateStr);
  const studyMin=sumDuration(sess);
  const studyScore=clamp(pct(studyMin,state.profile.dailyStudyTarget),0,100);
  const mcqCount=mcqTotals(state.mcq.filter(m=>m.date===dateStr)).attempted;
  const mcqScore=clamp(pct(mcqCount,state.profile.dailyMcqTarget),0,100);
  const revisionsDone=sess.filter(s=>s.activity==='Revision'||s.activity==='Formula Revision').length;
  const revisionScore=clamp(revisionsDone*25,0,100);
  const tasksToday=state.tasks.filter(t=>t.dueDate===dateStr);
  const tasksDone=tasksToday.filter(t=>t.completed).length;
  const taskScore= tasksToday.length? clamp(pct(tasksDone,tasksToday.length),0,100): (sess.length?60:0);
  const testsToday=state.tests.filter(t=>t.date===dateStr).length;
  const testScore=clamp(testsToday*100,0,100);
  const score=Math.round((studyScore*PROD_WEIGHTS.study+mcqScore*PROD_WEIGHTS.mcq+revisionScore*PROD_WEIGHTS.revision+taskScore*PROD_WEIGHTS.tasks+testScore*PROD_WEIGHTS.tests)/100);
  return clamp(score,0,100);
}

/* Streak calc (with streak-freeze support — a missed day doesn't break the streak if a freeze is available) */
function recalcStreak(){
  const target=state.profile.dailyStudyTarget;
  let cur=0, best=state.streak.best||0;
  let freezesLeft=state.profile.streakFreezes||0;
  state.streak.frozenDates=state.streak.frozenDates||{};
  for(let i=0;i<730;i++){
    const ds=isoDaysAgo(i);
    const dayMin=sumDuration(state.sessions.filter(s=>s.date===ds));
    const met=dayMin>=target;
    state.streak.history[ds]= dayMin>0 ? Math.min(4,Math.ceil(dayMin/ (target/4 || 30))) : 0;
    if(i===0){ if(met){ cur++; } else { continue; } }
    else{
      if(met){ cur++; }
      else if(freezesLeft>0){
        // auto-use a streak freeze to protect the run, but don't consume more than once per date
        freezesLeft--; state.streak.frozenDates[ds]=true; cur++;
      }
      else break;
    }
  }
  if(cur>best) best=cur;
  state.streak.current=cur; state.streak.best=best;
  // award a fresh streak freeze every 7-day milestone of best streak (max stash of 3)
  const milestone=Math.floor(best/7);
  if(milestone>0 && milestone>(state.profile.freezesAwardedAt||0)){
    const grant=milestone-(state.profile.freezesAwardedAt||0);
    state.profile.freezesAwardedAt=milestone;
    state.profile.streakFreezes=clamp((state.profile.streakFreezes||0)+grant,0,3);
    save();
    setTimeout(()=>{ toast('Streak Freeze earned — a missed day won\'t break your streak','🧊'); fireConfetti(); },400);
  }
  // auto-unlock a secret tip every 3-day streak milestone, up to the full vault
  if(!state.tipsUnlocked) state.tipsUnlocked=[0,1,2];
  const tipMilestone=Math.floor(cur/3);
  const tipsShouldHave=clamp(3+tipMilestone,3,SECRET_TIPS.length);
  if(state.tipsUnlocked.length<tipsShouldHave){
    const remaining=SECRET_TIPS.map((_,i)=>i).filter(i=>!state.tipsUnlocked.includes(i));
    while(state.tipsUnlocked.length<tipsShouldHave && remaining.length){
      const pick=remaining.splice(Math.floor(Math.random()*remaining.length),1)[0];
      state.tipsUnlocked.push(pick);
    }
    save();
  }
}

function focusAreas(){
  const arr=[];
  allChapters().forEach(({subject,chapter})=>{
    const mcqs=state.mcq.filter(m=>m.chapterId===chapter.id);
    const mt=mcqTotals(mcqs);
    const acc= mt.attempted? pct(mt.correct,mt.attempted):null;
    const overdue = chapter.revision.nextRevision && chapter.revision.nextRevision < todayStr();
    const lowConf = chapter.revision.confidence>0 && chapter.revision.confidence<=2;
    const tests=state.tests.filter(t=> (t.chapters||'').includes(chapter.id));
    const lowTest = tests.length && (tests.reduce((a,t)=>a+pct(t.marks,t.maxMarks),0)/tests.length) < 60;
    let score=0, reasons=[];
    if(acc!==null && acc<65){ score+=(65-acc); reasons.push(`Accuracy ${acc}% (${mt.attempted} MCQs)`); }
    if(overdue){ score+=30; reasons.push('Revision overdue'); }
    if(lowConf){ score+=15; reasons.push('Low confidence'); }
    if(lowTest){ score+=20; reasons.push('Low test performance'); }
    if(score>0) arr.push({subject,chapter,score,reasons});
  });
  return arr.sort((a,b)=>b.score-a.score).slice(0,6);
}

function recommendations(){
  const list=[];
  allChapters().forEach(({subject,chapter})=>{
    let priority=0, reason='';
    if(chapter.revision.nextRevision && chapter.revision.nextRevision<todayStr()){
      const days=daysBetween(chapter.revision.nextRevision,todayStr());
      priority+=40+days*2; reason=`Revision overdue by ${days} day${days!==1?'s':''}`;
    } else {
      const mcqs=mcqTotals(state.mcq.filter(m=>m.chapterId===chapter.id));
      if(mcqs.attempted>=5 && pct(mcqs.correct,mcqs.attempted)<65){ priority+=30; reason=`Accuracy ${pct(mcqs.correct,mcqs.attempted)}%`; }
    }
    const examDays=daysBetween(todayStr(),state.examDates.cet1.date);
    if(chapter.priority==='High') priority+=15;
    if(chapter.status==='Not Started'){ priority+=10; reason=reason||'Not started yet'; }
    const upcomingTest=state.tests.find(t=>(t.chapters||'').includes(chapter.id) && t.date>=todayStr());
    if(upcomingTest){ priority+=35; reason=`Test scheduled ${fmtDate(upcomingTest.date)}`; }

  });

}

   ladder instead of a vague feeling. Purely derived from real activity.

const SCHOLAR_TIERS=[
  {key:'starting',name:'Getting Started',icon:'🌱',min:0,tip:'Log your first few sessions — momentum starts with showing up, not with being perfect.'},
  {key:'building',name:'Building Momentum',icon:'📈',min:20,tip:'You\'re past the hardest part (starting). Now protect your streak — consistency beats intensity.'},
  {key:'consistent',name:'Consistent Student',icon:'💪',min:42,tip:'Add MCQ accuracy tracking and start weekly revision — this is where real recall gets built.'},
  {key:'strong',name:'Strong Performer',icon:'🔥',min:65,tip:'Focus on your weakest 3 chapters (see Focus Areas) and push test frequency up.'},
  {key:'scholar',name:'Scholar Track',icon:'🏅',min:85,tip:'You\'re operating like a topper. Keep PYQ volume high and tighten timing under mock conditions.'},
];
function computeScholarScore(){
  // Composite 0-100 score blending consistency, breadth, accuracy and exam-readiness signals
  const streakScore=clamp(pct(state.streak.current,14),0,100); // 14-day streak = full marks on this axis
  const totalChapters=allChapters().length||1;
  const mastered=allChapters().filter(x=>x.chapter.status==='Mastered'||x.chapter.status==='Test Completed').length;
  const syllabusScore=pct(mastered,totalChapters);
  const mt=mcqTotals(state.mcq);
  const accuracyScore= mt.attempted>=10? pct(mt.correct,mt.attempted) : Math.round(pct(mt.attempted,50)*0.6);
  const revisedChapters=allChapters().filter(x=>x.chapter.revision.level>0).length;
  const revisionScore=clamp(pct(revisedChapters,Math.max(6,Math.round(totalChapters*0.3))),0,100);
  const testScore=clamp(state.tests.length*12,0,100);
  const composite=Math.round(streakScore*0.25+syllabusScore*0.25+accuracyScore*0.25+revisionScore*0.15+testScore*0.1);
  return clamp(composite,0,100);
}
function scholarTierFor(score){
  let tier=SCHOLAR_TIERS[0];
  SCHOLAR_TIERS.forEach(t=>{ if(score>=t.min) tier=t; });
  const idx=SCHOLAR_TIERS.indexOf(tier);
  const next=SCHOLAR_TIERS[idx+1]||null;
  return {tier,next,score};
}

/* ================================================================
   CATCH-UP MODE — detects when someone has fallen behind their own
   targets and offers a lighter reset instead of piling on guilt.
   ================================================================ */
function catchUpStatus(){
  const ws=weekStart(new Date());
  const daysSoFarThisWeek=Math.max(1,daysBetween(ws.toISOString().slice(0,10),todayStr())+1);
  const expectedSoFar=(state.profile.weeklyStudyTarget/7)*daysSoFarThisWeek;
  const actual=sumDuration(weekSessions());
  const deficit=expectedSoFar-actual;
  const behindBadly= deficit > state.profile.dailyStudyTarget*2; // more than 2 days worth behind
  return {behindBadly, deficitMin:Math.max(0,Math.round(deficit)), actual, expectedSoFar:Math.round(expectedSoFar)};
}

/* ---------------- XP / Level system (fully derived, no extra storage) ---------------- */
function computeXP(){
  const studyMin=sumDuration(state.sessions);
  const mcqAttempted=mcqTotals(state.mcq).attempted;
  const revisions=state.sessions.filter(s=>s.activity==='Revision'||s.activity==='Formula Revision').length
    + allChapters().reduce((a,x)=>a+(x.chapter.revision.history?x.chapter.revision.history.length:0),0);
  const tests=state.tests.length;
  const chaptersDone=allChapters().filter(x=>x.chapter.status==='Mastered'||x.chapter.status==='Test Completed').length;
  const xp=Math.round(studyMin*1 + mcqAttempted*0.6 + revisions*8 + tests*20 + chaptersDone*15);
  // level curve: each level needs progressively more XP
  let level=1, remaining=xp, need=100;
  while(remaining>=need){ remaining-=need; level++; need=Math.round(need*1.18); }
  return {xp,level,intoLevel:remaining,needForLevel:need,progressPct:clamp(pct(remaining,need),0,100)};
}
let __lastKnownLevel=null;
function checkLevelUp(){
  const {level}=computeXP();
  if(__lastKnownLevel===null){ __lastKnownLevel=level; return; }
  if(level>__lastKnownLevel){ __lastKnownLevel=level; setTimeout(()=>{ toast(`Level ${level} reached!`,'🚀'); fireConfetti(); },350); }
}

function personalBests(){
  const dayTotals={}; state.sessions.forEach(s=>{ dayTotals[s.date]=(dayTotals[s.date]||0)+s.duration; });
  const bestDayEntry=Object.entries(dayTotals).sort((a,b)=>b[1]-a[1])[0];
  const mcqDayTotals={}; state.mcq.forEach(m=>{ mcqDayTotals[m.date]=(mcqDayTotals[m.date]||0)+m.attempted; });
  const bestMcqDay=Object.entries(mcqDayTotals).sort((a,b)=>b[1]-a[1])[0];
  const bestTest=state.tests.slice().sort((a,b)=>pct(b.marks,b.maxMarks)-pct(a.marks,a.maxMarks))[0];
  const dowTotals=[0,0,0,0,0,0,0], dowCount=[0,0,0,0,0,0,0];
  Object.keys(dayTotals).forEach(d=>{ const dow=(new Date(d).getDay()+6)%7; dowTotals[dow]+=dayTotals[d]; dowCount[dow]++; });
  const dowAvg=dowTotals.map((v,i)=>dowCount[i]?v/dowCount[i]:0);
  const bestDow=dowAvg.indexOf(Math.max(...dowAvg));
  const dowNames=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  return {
    bestDay: bestDayEntry? {date:bestDayEntry[0],min:bestDayEntry[1]} : null,
    bestStreak: state.streak.best||0,
    bestMcqDay: bestMcqDay? {date:bestMcqDay[0],count:bestMcqDay[1]} : null,
    bestTest: bestTest? {name:bestTest.name,pct:pct(bestTest.marks,bestTest.maxMarks)} : null,
    bestDow: dowCount[bestDow]? dowNames[bestDow] : null,
  };
}

/* ---------------- Confetti (lightweight canvas burst) ---------------- */
function fireConfetti(){
  const cv=$('#confettiCanvas'); if(!cv) return;
  const dpr=window.devicePixelRatio||1;
  cv.width=window.innerWidth*dpr; cv.height=window.innerHeight*dpr;
  cv.style.width=window.innerWidth+'px'; cv.style.height=window.innerHeight+'px';
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const colors=[cssVar('--accent-1')||'#7c9cff',cssVar('--accent-2')||'#86e3ce',cssVar('--accent-3')||'#c792ea','#ffb86b','#ff7593'];
  const N=70;
  const parts=Array.from({length:N},()=>({
    x:window.innerWidth/2+(Math.random()-0.5)*80, y:window.innerHeight*0.32,
    vx:(Math.random()-0.5)*9, vy:-Math.random()*8-4, g:0.28+Math.random()*0.12,
    size:4+Math.random()*5, color:colors[Math.floor(Math.random()*colors.length)],
    rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.4, life:1,
  }));
  let frame=0;
  function step(){
    frame++;
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    let alive=false;
    parts.forEach(p=>{
      if(p.life<=0) return;
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      if(frame>40) p.life-=0.025;
      if(p.life>0){
        alive=true;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=clamp(p.life,0,1);
        ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
        ctx.restore();
      }
    });
    if(alive && frame<220){ requestAnimationFrame(step); }
    else{ ctx.clearRect(0,0,window.innerWidth,window.innerHeight); }
  }
  requestAnimationFrame(step);
}

function ringSvg(percent,color,size,label){
  size=size||64; const r=(size-8)/2, c=2*Math.PI*r, off=c*(1-percent/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}
function countdownCard(exam,color){
  const now=new Date(); const target=new Date(exam.date+'T00:00:00');
  const diff=target-now;
  const d=Math.max(0,Math.floor(diff/86400000));
  const h=Math.max(0,Math.floor((diff%86400000)/3600000));
  return `<div class="card card-sm" style="border-color:${color}33;">
    <div style="font-size:11px;color:var(--text-2);font-weight:700;">${esc(exam.label)}${exam.estimated?' <span style=\"opacity:.7\">(est.)</span>':''}</div>
    <div class="k-val tabular" style="margin-top:6px;color:${color};font-size:26px;">${d}</div>
    <div class="k-cap">days · ${h}h left</div>
  </div>`;
}

/* ================================================================
   REVISION HUB
   ================================================================ */
function renderRevision(){
  const items=allChapters().filter(x=>x.chapter.revision.level>0 || x.chapter.revision.nextRevision);
  const groups={overdue:[],today:[],soon:[],done:[]};
  items.forEach(x=>{
    const nr=x.chapter.revision.nextRevision;
    if(!nr){ return; }
    if(nr<todayStr()) groups.overdue.push(x);
    else if(nr===todayStr()) groups.today.push(x);
    else if(daysBetween(todayStr(),nr)<=7) groups.soon.push(x);
  });
  allChapters().filter(x=>x.chapter.status==='Mastered').forEach(x=>groups.done.push(x));
  function block(title,emoji,arr,color){
    if(!arr.length) return '';
    return `<div class="section"><div class="section-head"><h3>${emoji} ${title} (${arr.length})</h3></div><div class="card">
      ${arr.map(({subject,chapter})=>`<div class="list-row">
        <div class="dot" style="background:${color}"></div>
        <div style="flex:1;"><div style="font-weight:700;font-size:13.5px;">${esc(subject.name)} · ${esc(chapter.name)}</div>
        <div style="font-size:11.5px;color:var(--text-2);">${chapter.revision.nextRevision?('Due '+fmtDate(chapter.revision.nextRevision)):'—'} · Confidence ${chapter.revision.confidence||'—'}</div></div>
        <button class="btn btn-sm" onclick="App.openRevisionForm('${subject.id}','${chapter.id}')">Revise</button>
      </div>`).join('')}
    </div></div>`;
  }
  const hasAny=items.length>0;
  return `
  ${block('Overdue','🔴',groups.overdue,'#ff7593')}
  ${block('Due Today','🟠',groups.today,'#ffb86b')}
  ${block('Due Soon (7 days)','🟡',groups.soon,'#ffd479')}
  ${block('Recently Mastered','🟢',groups.done.slice(0,6),'#7ee0b8')}
  ${!hasAny? `<div class="card">${emptyState('🔁','No revisions scheduled yet','Mark chapters as revised from the Subjects tab to start spaced repetition')}</div>`:''}
  <div class="section">
    <div class="section-head"><h3>Spaced Repetition Intervals</h3></div>
    <div class="card">
      <div style="font-size:12.5px;color:var(--text-2);margin-bottom:10px;">Days until next revision, based on confidence rating (1–5). Editable in Settings.</div>
      <div class="grid grid-4">
        ${[1,2,3,4,5].map(c=>`<div style="text-align:center;"><div class="k-val" style="font-size:16px;">${state.profile.revisionIntervals[c]}d</div><div class="k-cap">Conf ${c}</div></div>`).join('')}
      </div>
    </div>
  </div>
  `;
}

let calMonth=new Date().getMonth(), calYear=new Date().getFullYear();
function renderCalendar(){
  const first=new Date(calYear,calMonth,1);
  const startDow=(first.getDay()+6)%7; // Monday=0
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const cells=[];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  function dayEvents(d){
    const iso=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const ev=[];
    if(state.sessions.some(s=>s.date===iso)) ev.push('#7c9cff');
    if(state.tests.some(t=>t.date===iso)) ev.push('#ff7593');
    if(state.tasks.some(t=>t.dueDate===iso)) ev.push('#ffb86b');
    if(allChapters().some(x=>x.chapter.revision.nextRevision===iso)) ev.push('#86e3ce');
    Object.values(state.examDates).forEach(e=>{ if(e.date===iso) ev.push('#c792ea'); });
    return ev;
  }
  return `
  <div class="section">
    <div class="card">

      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:10.5px;color:var(--text-2);text-align:center;margin-bottom:6px;">
        ${['M','T','W','T','F','S','S'].map(d=>`<div>${d}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">
        ${cells.map(d=>{
          if(!d) return '<div></div>';
          const iso=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
          const ev=dayEvents(d); const isToday=iso===todayStr();
          return `<div class="tap" style="aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:${isToday?'var(--glass-hi)':'transparent'};border:1px solid ${isToday?'var(--accent-1)':'transparent'};cursor:pointer;" onclick="App.showDayDetail('${iso}')">
            <div style="font-size:12px;font-weight:${isToday?800:600};">${d}</div>
            <div style="display:flex;gap:2px;margin-top:2px;">${ev.slice(0,3).map(c=>`<div style="width:4px;height:4px;border-radius:50%;background:${c};"></div>`).join('')}</div>
          </div>`;

    </div>
  </div>
  <div class="section"><div class="card" style="font-size:12px;color:var(--text-2);display:flex;gap:14px;flex-wrap:wrap;">
    <span><span class="dot" style="background:#7c9cff;display:inline-block;"></span> Study</span>
    <span><span class="dot" style="background:#ff7593;display:inline-block;"></span> Test</span>

      <div class="grid grid-2">

/* -------- Canvas chart drawing engine (lightweight, no deps) -------- */
function cssVar(name){ return getComputedStyle(document.body).getPropertyValue(name).trim(); }
function setupCanvas(cv){
  if(!cv) return null;
  const dpr=window.devicePixelRatio||1;
  // IMPORTANT: read the intended display height from the CSS/attribute height ONCE via a data-attr,
  // never from cv.height itself — cv.height is the drawing-buffer size and grows every redraw if reused,
  // which is what caused charts to balloon and go blank white on repeated renders.
  if(!cv.dataset.baseH){
    cv.dataset.baseH = cv.getAttribute('height') || '150';
  }
  const h = Number(cv.dataset.baseH) || 150;
  const w = cv.parentElement ? cv.parentElement.clientWidth : (cv.clientWidth || 300);
  if(w<=0) return null;
  cv.width = Math.round(w*dpr);
  cv.height = Math.round(h*dpr);
  cv.style.width = w+'px';
  cv.style.height = h+'px';
  const ctx=cv.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0); // reset any prior scale before re-scaling, avoids compounding transforms
  ctx.scale(dpr,dpr);
  return {ctx,w,h};
}
function drawLine(id,labels,values,color){
  const cv=$('#'+id); if(!cv) return; const s=setupCanvas(cv); if(!s) return; const {ctx,w,h}=s;
  ctx.clearRect(0,0,w,h);
  const pad={l:34,r:10,t:14,b:22};
  const max=Math.max(1,...values);
  const stepX=(w-pad.l-pad.r)/Math.max(1,values.length-1);
  ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1;
  for(let i=0;i<=3;i++){ const y=pad.t+(h-pad.t-pad.b)*(i/3); ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke(); }
  ctx.fillStyle=cssVar('--text-2'); ctx.font='9.5px -apple-system,sans-serif'; ctx.textAlign='right';
  for(let i=0;i<=3;i++){ const y=pad.t+(h-pad.t-pad.b)*(i/3); ctx.fillText(Math.round(max*(1-i/3)),pad.l-6,y+3); }
  // area
  const grad=ctx.createLinearGradient(0,pad.t,0,h-pad.b);
  grad.addColorStop(0,color+'55'); grad.addColorStop(1,color+'00');
  ctx.beginPath();
  values.forEach((v,i)=>{ const x=pad.l+i*stepX, y=pad.t+(h-pad.t-pad.b)*(1-v/max); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.lineTo(pad.l+(values.length-1)*stepX,h-pad.b); ctx.lineTo(pad.l,h-pad.b); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  ctx.beginPath(); ctx.lineWidth=2.4; ctx.strokeStyle=color; ctx.lineJoin='round';
  values.forEach((v,i)=>{ const x=pad.l+i*stepX, y=pad.t+(h-pad.t-pad.b)*(1-v/max); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.stroke();
  values.forEach((v,i)=>{ const x=pad.l+i*stepX, y=pad.t+(h-pad.t-pad.b)*(1-v/max); ctx.beginPath(); ctx.fillStyle=color; ctx.arc(x,y,2.4,0,7); ctx.fill(); });
  ctx.fillStyle=cssVar('--text-3'); ctx.font='9px -apple-system,sans-serif'; ctx.textAlign='center';
  const skip=Math.ceil(labels.length/6);
  labels.forEach((l,i)=>{ if(i%skip===0){ ctx.fillText(l,pad.l+i*stepX,h-6); } });
}
function drawBar(id,labels,values,colors){
  const cv=$('#'+id); if(!cv) return; const s=setupCanvas(cv); if(!s) return; const {ctx,w,h}=s;
  ctx.clearRect(0,0,w,h);
  const pad={l:34,r:10,t:14,b:26};
  const max=Math.max(1,...values);
  const bw=(w-pad.l-pad.r)/values.length;
  ctx.strokeStyle='rgba(255,255,255,0.08)';
  for(let i=0;i<=3;i++){ const y=pad.t+(h-pad.t-pad.b)*(i/3); ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke(); }
  ctx.fillStyle=cssVar('--text-2'); ctx.font='9.5px -apple-system,sans-serif'; ctx.textAlign='right';
  for(let i=0;i<=3;i++){ const y=pad.t+(h-pad.t-pad.b)*(i/3); ctx.fillText(Math.round(max*(1-i/3)),pad.l-6,y+3); }
  values.forEach((v,i)=>{
    const x=pad.l+i*bw+bw*0.18, bh=(h-pad.t-pad.b)*(v/max), y=h-pad.b-bh;
    const c=Array.isArray(colors)?colors[i%colors.length]:(colors||'#7c9cff');
    const grad=ctx.createLinearGradient(0,y,0,h-pad.b); grad.addColorStop(0,c); grad.addColorStop(1,c+'99');
    ctx.fillStyle=grad;
    roundRectPath(ctx,x,y,bw*0.64,Math.max(bh,1),4); ctx.fill();
  });
  ctx.fillStyle=cssVar('--text-3'); ctx.font='9px -apple-system,sans-serif'; ctx.textAlign='center';
  labels.forEach((l,i)=>{ const x=pad.l+i*bw+bw/2; ctx.fillText(String(l).slice(0,8),x,h-8); });
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawHBar(id,labels,values,colors){
  const cv=$('#'+id); if(!cv) return; const s=setupCanvas(cv); if(!s) return; const {ctx,w,h}=s;
  ctx.clearRect(0,0,w,h);
  const pad={l:90,r:34,t:6,b:6};
  const max=100;
  const bh=(h-pad.t-pad.b)/values.length;
  values.forEach((v,i)=>{
    const y=pad.t+i*bh+bh*0.22, bw2=(w-pad.l-pad.r)*(v/max);
    ctx.fillStyle=cssVar('--text-1'); ctx.font='11px -apple-system,sans-serif'; ctx.textAlign='right';
    ctx.fillText(String(labels[i]).slice(0,13),pad.l-8,y+bh*0.28+3);
    const c=Array.isArray(colors)?colors[i%colors.length]:'#7c9cff';
    roundRectPath(ctx,pad.l,y,Math.max(bw2,2),bh*0.56,5); ctx.fillStyle=c; ctx.fill();
    ctx.fillStyle=cssVar('--text-2'); ctx.font='10px -apple-system,sans-serif'; ctx.textAlign='left';
    ctx.fillText(v+'%',pad.l+bw2+6,y+bh*0.28+3);
  });
}
function drawPie(id,labels,values,colors){
  const cv=$('#'+id); if(!cv) return; const s=setupCanvas(cv); if(!s) return; const {ctx,w,h}=s;
  ctx.clearRect(0,0,w,h);
  const total=values.reduce((a,b)=>a+b,0);
  const cx=w*0.32, cy=h/2, r=Math.min(cy,w*0.3)-8;
  if(total<=0){ ctx.fillStyle=cssVar('--text-3'); ctx.font='12px -apple-system,sans-serif'; ctx.textAlign='center'; ctx.fillText('No data',cx,cy); return; }
  let start=-Math.PI/2;
  values.forEach((v,i)=>{
    const ang=(v/total)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,start+ang); ctx.closePath();
    ctx.fillStyle=colors[i%colors.length]; ctx.fill();
    start+=ang;
  });
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath(); ctx.arc(cx,cy,r*0.55,0,7); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  // legend
  let ly=14;
  labels.forEach((l,i)=>{
    if(values[i]<=0) return;
    ctx.fillStyle=colors[i%colors.length]; roundRectPath(ctx,w*0.62,ly,9,9,2.5); ctx.fill();
    ctx.fillStyle=cssVar('--text-1'); ctx.font='10.5px -apple-system,sans-serif'; ctx.textAlign='left';
    ctx.fillText(`${l} (${pct(values[i],total)}%)`,w*0.62+14,ly+8.5);
    ly+=18;
  });
}
const PIE_COLORS=['#7c9cff','#86e3ce','#c792ea','#ffb86b','#ff7593','#7ee0b8','#ffd479','#a0c4ff'];

function drawHomeCharts(){

  drawBar('homeWeekChart',days,vals,'#7c9cff');
}
function drawAllCharts(){

  drawLine('chDailyHours',days14,vals14,'#7c9cff');
  // subject hours
  const subLabels=state.subjects.map(s=>s.name.slice(0,6)); const subVals=state.subjects.map(s=>Math.round(sumDuration(state.sessions.filter(x=>x.subjectId===s.id))/6)/10);
  drawBar('chSubjectHours',subLabels,subVals,state.subjects.map(s=>s.color));
  // weekly trend 8 weeks
  const wLabels=[],wVals=[];
  for(let i=7;i>=0;i--){ const ws=weekStart(new Date()); ws.setDate(ws.getDate()-i*7); const we=new Date(ws); we.setDate(we.getDate()+7);
    const min=sumDuration(state.sessions.filter(s=>{const d=new Date(s.date);return d>=ws&&d<we;}));
    wLabels.push('W'+(8-i)); wVals.push(Math.round(min/6)/10); }
  drawLine('chWeeklyTrend',wLabels,wVals,'#86e3ce');
  // activity pie
  const actTotals={}; state.sessions.forEach(s=>actTotals[s.activity]=(actTotals[s.activity]||0)+s.duration);
  const actEntries=Object.entries(actTotals).sort((a,b)=>b[1]-a[1]).slice(0,6);
  drawPie('chActivityPie',actEntries.map(e=>e[0]),actEntries.map(e=>e[1]),PIE_COLORS);
  // mcq accuracy over time (by week)
  const maLabels=[],maVals=[];
  for(let i=7;i>=0;i--){ const ws=weekStart(new Date()); ws.setDate(ws.getDate()-i*7); const we=new Date(ws); we.setDate(we.getDate()+7);
    const list=state.mcq.filter(m=>{const d=new Date(m.date);return d>=ws&&d<we;}); const t=mcqTotals(list);

  drawLine('chMcqAccuracy',maLabels,maVals,'#c792ea');
  // mcq by subject
  const msVals=state.subjects.map(s=>mcqTotals(state.mcq.filter(m=>m.subjectId===s.id)).attempted);
  drawBar('chMcqSubject',subLabels,msVals,state.subjects.map(s=>s.color));

  // test scores over time
  const tests=state.tests.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-12);
  drawLine('chTestScores',tests.map(t=>new Date(t.date).getDate()+''),tests.map(t=>pct(t.marks,t.maxMarks)),'#ffb86b');
  // subject completion horizontal bar
  drawHBar('chSubjectCompletion',state.subjects.map(s=>s.name),state.subjects.map(s=>subjectStats(s).percent),state.subjects.map(s=>s.color));
  // CET vs HSC pie
  drawPie('chCetHscPie',['CET','HSC'],[overallProgress('CET'),overallProgress('HSC')],['#7c9cff','#86e3ce']);
  // foundation bar
  const foundSubs=state.subjects.filter(s=>s.foundationTopics&&s.foundationTopics.length);
  drawBar('chFoundation',foundSubs.map(s=>s.name.slice(0,6)),foundSubs.map(s=>pct(s.foundationTopics.filter(t=>t.done).length,s.foundationTopics.length||1)),foundSubs.map(s=>s.color));

  const doneT=state.tasks.filter(t=>t.completed).length, pendT=state.tasks.filter(t=>!t.completed).length;

  // strongest / weakest rankings
  const ranked=state.subjects.map(s=>({s,st:subjectStats(s)})).sort((a,b)=>b.st.percent-a.st.percent);
  $('#rankStrong')&&( $('#rankStrong').innerHTML = ranked.slice(0,3).map((r,i)=>`<div class="list-row"><div style="width:22px;font-weight:800;">${i+1}</div><div style="flex:1;">${esc(r.s.name)}</div><span class="badge green">${r.st.percent}%</span></div>`).join('') || emptyState('—','No data','') );
  const weakChaps=focusAreas();

  // dow productivity

  drawBar('chDowProd',dowLabels,dowVals.map((v,i)=>dowCount[i]?Math.round(v/dowCount[i]):0),'#7c9cff');
  drawHeatmap();
}
function drawHeatmap(){
  const grid=$('#heatGrid'); if(!grid) return;
  const months=Number(heatRange);
  const days=months*30;
  grid.innerHTML='';
  for(let i=days;i>=0;i--){
    const iso=isoDaysAgo(i);
    const min=sumDuration(state.sessions.filter(s=>s.date===iso));
    const level= min<=0?0: min<30?1: min<60?2: min<120?3:4;
    const colors=['rgba(255,255,255,0.06)','#2d3f6b','#3f5aa0','#5b7fe0','#86a3ff'];
    const cell=document.createElement('div'); cell.className='heat-cell'; cell.style.background=colors[level]; cell.title=iso+' · '+minToHm(min);
    cell.onclick=()=>showHeatDetail(iso);
    grid.appendChild(cell);
  }
  grid.scrollLeft=grid.scrollWidth;
}
function showHeatDetail(iso){
  const min=sumDuration(state.sessions.filter(s=>s.date===iso));
  const mcq=mcqTotals(state.mcq.filter(m=>m.date===iso)).attempted;
  const tasks=state.tasks.filter(t=>t.dueDate===iso&&t.completed).length;
  const revs=state.sessions.filter(s=>s.date===iso&&(s.activity==='Revision'||s.activity==='Formula Revision')).length;
  const tests=state.tests.filter(t=>t.date===iso).length;
  $('#heatDetail').innerHTML=`<b>${fmtDate(iso)}</b> — ${minToHm(min)} studied · ${mcq} MCQs · ${revs} revisions · ${tasks} tasks done · ${tests} tests`;
}

function renderSearch(){
  return `<div class="search-bar"><span>🔍</span><input id="globalSearchInput" placeholder="Search subjects, chapters, notes, tasks, formulas…" oninput="App.runSearch(this.value)" autofocus></div>
  <div id="searchResults"></div>`;
}
function runSearch(q){
  const el=$('#searchResults'); if(!q||q.length<2){ el.innerHTML=''; return; }
  q=q.toLowerCase();
  const results=[];
  state.subjects.forEach(s=>{ if(s.name.toLowerCase().includes(q)) results.push({type:'Subject',label:s.name,go:()=>go('subjects',s.id)});
    s.chapters.forEach(c=>{ if(c.name.toLowerCase().includes(q)) results.push({type:'Chapter',label:s.name+' → '+c.name,go:()=>go('subjects',s.id)}); }); });
  state.notes.forEach(n=>{ if((n.title+n.content).toLowerCase().includes(q)) results.push({type:'Note',label:n.title,go:()=>{go('notes');setTimeout(()=>openNoteForm(n.id),200);}}); });
  state.tasks.forEach(t=>{ if(t.title.toLowerCase().includes(q)) results.push({type:'Task',label:t.title,go:()=>go('tasks')}); });
  state.formulas.forEach(f=>{ if((f.formula+f.meaning).toLowerCase().includes(q)) results.push({type:'Formula',label:f.formula,go:()=>go('formulas')}); });
  state.mistakes.forEach(m=>{ if((m.question||'').toLowerCase().includes(q)) results.push({type:'Mistake',label:m.question,go:()=>go('mistakes')}); });
  state.tests.forEach(t=>{ if(t.name.toLowerCase().includes(q)) results.push({type:'Test',label:t.name,go:()=>go('tests')}); });
  el.innerHTML = results.length? `<div class="card">${results.slice(0,30).map((r,i)=>`<div class="list-row" style="cursor:pointer;" onclick="App.searchGo(${i})"><span class="badge blue">${r.type}</span><div style="flex:1;font-size:13.5px;">${esc(r.label||'')}</div></div>`).join('')}</div>` : emptyState('🔍','No results','Try a different search term');
  window.__searchResults=results;
}
function searchGo(i){ const r=window.__searchResults[i]; if(r) r.go(); }

/* ---------------- Focus Mode (Pomodoro) ---------------- */
let focusOverlayOpen=false, focusInterval=null;
function openFocusSetup(){
  const sid=state.pomodoro.subjectId||state.timer.subjectId||'';
  openSheet('Focus Sprint Setup',`
    <div class="form-row">
      <div class="form-group"><label class="form-label">Subject</label><select class="form-select" id="focSubject" onchange="App.focusSubjChange()">${subjectOptions(sid)}</select></div>
      <div class="form-group"><label class="form-label">Chapter</label><select class="form-select" id="focChapter">${chapterOptions(sid||state.subjects[0]?.id,'')}</select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Focus (min)</label><input type="number" class="form-input" id="focWork" value="${state.profile.pomodoroWork}"></div>
      <div class="form-group"><label class="form-label">Break (min)</label><input type="number" class="form-input" id="focBreak" value="${state.profile.pomodoroBreak}"></div>
    </div>
    <div style="font-size:12px;color:var(--text-2);margin-bottom:6px;">Long break of ${state.profile.pomodoroLongBreak}m kicks in every ${state.profile.pomodoroCyclesForLong} sprints. Each completed sprint auto-logs as a study session.</div>
    <div class="sheet-actions"><button class="btn btn-primary btn-block" onclick="App.startFocusSession()">Start Sprint 🎯</button></div>
  `);
}
function focusSubjChange(){ $('#focChapter').innerHTML=chapterOptions($('#focSubject').value,''); }
function startFocusSession(){
  const sid=$('#focSubject')?.value||''; const cid=$('#focChapter')?.value||'';
  const workMin=clamp(Number($('#focWork')?.value)||state.profile.pomodoroWork,5,180);
  const breakMin=clamp(Number($('#focBreak')?.value)||state.profile.pomodoroBreak,1,60);
  state.profile.pomodoroWork=workMin; state.profile.pomodoroBreak=breakMin;
  state.pomodoro={active:true,mode:'focus',running:true,phaseEndAt:Date.now()+workMin*60000,remainingMs:0,cyclesDone:0,subjectId:sid,chapterId:cid};
  save(); closeSheet(); openFocusOverlay();
}
function openFocusOverlay(){
  if(!state.pomodoro.active) return;
  focusOverlayOpen=true;
  $('#focusLock').classList.add('show');
  renderFocusOverlay();
  clearInterval(focusInterval);
  focusInterval=setInterval(tickFocus,500);
}
function closeFocusOverlay(){
  focusOverlayOpen=false;
  $('#focusLock').classList.remove('show');
}
function tickFocus(){
  const p=state.pomodoro;
  if(!p.active){ clearInterval(focusInterval); focusInterval=null; return; }
  if(p.running && p.phaseEndAt-Date.now()<=0){ handlePhaseComplete(false); return; }
  if(focusOverlayOpen) renderFocusOverlay();
}
function currentPhaseTotalMs(){
  const p=state.pomodoro;
  if(p.mode==='focus') return state.profile.pomodoroWork*60000;
  const isLong= p.cyclesDone>0 && p.cyclesDone % state.profile.pomodoroCyclesForLong===0;
  return (isLong? state.profile.pomodoroLongBreak : state.profile.pomodoroBreak)*60000;
}
function renderFocusOverlay(){
  const p=state.pomodoro; if(!p.active) return;
  const totalMs=currentPhaseTotalMs();
  const remaining= p.running? Math.max(0,p.phaseEndAt-Date.now()) : p.remainingMs;
  const secs=Math.ceil(remaining/1000);
  const mm=String(Math.floor(secs/60)).padStart(2,'0'), ss=String(secs%60).padStart(2,'0');
  $('#flTime').textContent=mm+':'+ss;
  $('#flMode').textContent= p.mode==='focus'?'FOCUS':'BREAK';
  const subj=subjectById(p.subjectId);
  $('#flSub').textContent= p.mode==='focus'? (subj? subj.name+(p.chapterId?(' · '+(chapterById(p.subjectId,p.chapterId)?.name||'')):''):'Stay locked in — you\'ve got this') : 'Stretch, hydrate, breathe 🌿';
  $('#flPip').textContent=`🎯 Sprint ${p.cyclesDone+1} · ${p.cyclesDone} completed today`;
  $('#flPauseBtn').textContent= p.running?'⏸':'▶';
  const donePct= totalMs>0? clamp(100-Math.round((remaining/totalMs)*100),0,100):0;
  $('#flRing').innerHTML=ringSvg(donePct, p.mode==='focus'?'#7c9cff':'#7ee0b8',150);
}
function togglePauseFocus(){
  const p=state.pomodoro; if(!p.active) return;
  if(p.running){ p.remainingMs=Math.max(0,p.phaseEndAt-Date.now()); p.running=false; }
  else{ p.phaseEndAt=Date.now()+p.remainingMs; p.running=true; }
  save(); renderFocusOverlay();
}
function skipFocusPhase(){ handlePhaseComplete(true); }
function handlePhaseComplete(manualSkip){
  const p=state.pomodoro; if(!p.active) return;
  if(p.mode==='focus'){
    let mins;
    if(manualSkip){
      const remaining=p.running? Math.max(0,p.phaseEndAt-Date.now()) : p.remainingMs;
      mins=Math.max(1,Math.round((state.profile.pomodoroWork*60000-remaining)/60000));
    } else { mins=state.profile.pomodoroWork; }
    state.sessions.push({id:uid(),date:todayStr(),subjectId:p.subjectId,chapterId:p.chapterId,type:'Concept Learning',activity:'Concept Learning',duration:mins,createdAt:new Date().toISOString(),notes:'Focus Sprint',mood:''});
    p.cyclesDone++;
    const longBreak= p.cyclesDone>0 && p.cyclesDone % state.profile.pomodoroCyclesForLong===0;
    const breakMin= longBreak? state.profile.pomodoroLongBreak : state.profile.pomodoroBreak;
    p.mode='break'; p.running=true; p.phaseEndAt=Date.now()+breakMin*60000; p.remainingMs=0;
    save(); recalcStreak(); checkAchievements(); checkLevelUp();
    if(navigator.vibrate) navigator.vibrate([80,40,80]);
    toast(`Sprint complete · ${minToHm(mins)} logged — ${longBreak?'long ':''}break time`,'🎯');
  } else {
    p.mode='focus'; p.running=true; p.phaseEndAt=Date.now()+state.profile.pomodoroWork*60000; p.remainingMs=0;
    save();
    if(navigator.vibrate) navigator.vibrate(60);
    toast("Break's over — back to it",'🔥');
  }
  if(focusOverlayOpen) renderFocusOverlay();
  if(currentPage==='study') render();
}
function endFocusSession(){
  const p=state.pomodoro; if(!p.active) return;
  if(!confirm('End this focus sprint?')) return;
  if(p.mode==='focus'){
    const remaining= p.running? Math.max(0,p.phaseEndAt-Date.now()) : p.remainingMs;
    const mins=Math.round((state.profile.pomodoroWork*60000-remaining)/60000);
    if(mins>=1){
      state.sessions.push({id:uid(),date:todayStr(),subjectId:p.subjectId,chapterId:p.chapterId,type:'Concept Learning',activity:'Concept Learning',duration:mins,createdAt:new Date().toISOString(),notes:'Focus Sprint (ended early)',mood:''});
      recalcStreak(); checkAchievements(); checkLevelUp();
    }
  }
  clearInterval(focusInterval); focusInterval=null;
  state.pomodoro={active:false,mode:'focus',running:false,phaseEndAt:0,remainingMs:0,cyclesDone:0,subjectId:'',chapterId:''};
  save(); closeFocusOverlay(); if(currentPage==='study') render(); toast('Focus session ended','✅');
}

  const s=subjectById(sid); const c=chapterById(sid,cid); if(!s||!c) return;
  const steps=ladderProgress(c);
  const doneCount=steps.filter(x=>x.done).length;
  openSheet('Concept Ladder',`
    <div style="text-align:center;margin-bottom:16px;">
      <div style="font-weight:800;font-size:16px;">${esc(s.icon)} ${esc(c.name)}</div>
      <div style="font-size:12px;color:var(--text-2);margin-top:4px;">${doneCount}/${steps.length} steps complete — one step at a time</div>
      <div class="progress-track" style="margin-top:10px;"><div class="progress-fill primary" style="width:${pct(doneCount,steps.length)}%"></div></div>
    </div>
    ${steps.map((st,i)=>{
      const locked = i>0 && !steps[i-1].done && !st.done;
      return `<div class="list-row" style="opacity:${locked?0.45:1};">
        <div class="check-box ${st.done?'done':''}" style="cursor:${locked?'not-allowed':'pointer'};" ${locked?'':`onclick="App.toggleLadderStep('${sid}','${cid}','${st.statusAtLeast}')"`}>${st.done?'✓':(locked?'🔒':i+1)}</div>
        <div style="flex:1;">
          <div style="font-weight:700;font-size:13.5px;" class="${st.done?'strike':''}">${st.icon} ${esc(st.label)}</div>
        </div>
      </div>`;
    }).join('')}
    <div style="font-size:11.5px;color:var(--text-2);margin-top:14px;line-height:1.5;">Tapping a step marks the chapter's overall status up to that point — it never moves backward automatically, so your existing progress is always safe.</div>
  `);
}
function toggleLadderStep(sid,cid,statusAtLeast){
  const c=chapterById(sid,cid); if(!c) return;
  const targetWeight=chapterStatusWeight(statusAtLeast);
  const currentWeight=chapterStatusWeight(c.status);
  if(currentWeight>=targetWeight){
    // un-checking: step back to the level just before this step
    const idx=LADDER_STEPS.findIndex(s=>s.statusAtLeast===statusAtLeast);
    c.status = idx>0? LADDER_STEPS[idx-1].statusAtLeast : 'Not Started';
  } else {
    c.status = statusAtLeast;
  }
  save(); checkAchievements(); checkLevelUp();
  openConceptLadder(sid,cid);
  if(currentPage==='subjects') render();
}

/* --- Shareable Stats Card ("Wrapped"-style) --- */
function openShareCard(){

function drawShareCard(){
  const cv=$('#shareCanvas'); if(!cv) return;
  const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  const c1=cssVar('--accent-1')||'#7c9cff', c2=cssVar('--accent-3')||'#c792ea', c3=cssVar('--accent-2')||'#86e3ce';
  // background
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#05060c'); bg.addColorStop(1,'#0d1024');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // glow orbs
  [[W*0.15,H*0.12,c1],[W*0.9,H*0.28,c2],[W*0.2,H*0.85,c3]].forEach(([x,y,c])=>{
    const g=ctx.createRadialGradient(x,y,0,x,y,380);
    g.addColorStop(0,c+'55'); g.addColorStop(1,c+'00');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  });
  // header
  ctx.fillStyle='#fff'; ctx.font='800 46px -apple-system,sans-serif'; ctx.textAlign='left';
  ctx.fillText('Ascent',70,140);
  ctx.font='600 26px -apple-system,sans-serif'; ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.fillText(state.profile.name+"'s Progress",70,182);
  ctx.font='500 22px -apple-system,sans-serif'; ctx.fillStyle='rgba(255,255,255,.4)';
  ctx.fillText(new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}),70,216);
  // glass card stats
  function glassCard(x,y,w,h){
    ctx.save();
    roundRectPath(ctx,x,y,w,h,28);
    ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.stroke();
    ctx.restore();
  }
  const {level,xp}=computeXP();
  const stats=[
    {label:'DAY STREAK',val:state.streak.current,emoji:'🔥'},
    {label:'STUDY HOURS',val:Math.round(sumDuration(state.sessions)/6)/10,emoji:'⏱️'},
    {label:'LEVEL',val:level,emoji:'🚀'},
    {label:'MCQs SOLVED',val:mcqTotals(state.mcq).attempted,emoji:'🧠'},
  ];
  const gx=70, gy=260, gw=(W-70*2-24)/2, gh=190;
  stats.forEach((s,i)=>{
    const x=gx+(i%2)*(gw+24), y=gy+Math.floor(i/2)*(gh+24);
    glassCard(x,y,gw,gh);
    ctx.font='54px -apple-system,sans-serif'; ctx.fillStyle='#fff'; ctx.textAlign='left';
    ctx.fillText(s.emoji,x+26,y+66);
    ctx.font='800 56px -apple-system,sans-serif'; ctx.fillStyle='#fff';
    ctx.fillText(String(s.val),x+26,y+134);
    ctx.font='700 20px -apple-system,sans-serif'; ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.fillText(s.label,x+26,y+164);
  });
  // progress bars: CET / HSC
  const py=gy+gh*2+64;
  glassCard(70,py,W-140,200);
  ctx.font='700 22px -apple-system,sans-serif'; ctx.fillStyle='rgba(255,255,255,.7)'; ctx.textAlign='left';
  ctx.fillText('SYLLABUS PROGRESS',110,py+50);
  [['MHT CET',overallProgress('CET'),c1],['HSC Board',overallProgress('HSC'),c2]].forEach(([label,val,col],i)=>{
    const by=py+82+i*54;
    ctx.font='600 24px -apple-system,sans-serif'; ctx.fillStyle='#fff';
    ctx.fillText(label,110,by);
    ctx.font='700 24px -apple-system,sans-serif'; ctx.textAlign='right'; ctx.fillText(val+'%',W-110,by); ctx.textAlign='left';
    roundRectPath(ctx,110,by+14,W-220,10,5); ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fill();
    roundRectPath(ctx,110,by+14,(W-220)*(val/100),10,5); ctx.fillStyle=col; ctx.fill();
  });
  // footer
  const days=daysBetween(todayStr(),state.examDates.cet1.date);
  ctx.textAlign='center'; ctx.font='700 26px -apple-system,sans-serif'; ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.fillText(`${days} days to MHT CET · Built with Ascent`,W/2,H-70);
  const btn=$('#shareDownloadBtn');
  if(btn) btn.onclick=()=>{
    const a=document.createElement('a'); a.href=cv.toDataURL('image/png'); a.download=`ascent-stats-${todayStr()}.png`;
    document.body.appendChild(a); a.click(); a.remove(); toast('Stats card downloaded','✨');
  };
}

/* --- Export / Import / Reset --- */
function exportData(){
  state.profile.lastBackup=new Date().toISOString();
  save();
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`ascent-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  render(); toast('Backup downloaded','⬇️');
}
function triggerImport(){ $('#importFile').click(); }
function importData(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data || typeof data!=='object' || !data.subjects){ toast('Invalid backup file','⚠️'); return; }
      if(!confirm('This will replace all current data with the backup. Continue?')) return;
      state=data; save(); applyTheme(); render();
      toast('Data restored from backup','✅');
    }catch(err){ toast('Could not read file — invalid JSON','⚠️'); }
  };
  reader.readAsText(file);
}
function resetScope(scope){
  if(scope==='today'){
    if(!confirm("Reset today's study sessions, MCQs and tests?")) return;
    const t=todayStr();
    state.sessions=state.sessions.filter(s=>s.date!==t);
    state.mcq=state.mcq.filter(m=>m.date!==t);
    state.tests=state.tests.filter(x=>x.date!==t);
    toast("Today's data reset",'♻️');
  } else if(scope==='analytics'){
    if(!confirm('Reset all sessions, MCQ records and test records? Tasks, notes, chapters and formulas stay untouched.')) return;
    state.sessions=[]; state.mcq=[]; state.tests=[]; state.pyq=[];
    toast('Analytics reset','♻️');
  }
  save(); recalcStreak(); render();
}

function buildManifest(){
  const manifest={
    name:"Ascent — CET & HSC Command Center",short_name:"Ascent",
    start_url:".",display:"standalone",background_color:"#05060c",theme_color:"#05060c",
    icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect rx='22' width='100' height='100' fill='%23090b14'/%3E%3Cpath d='M50 20 L75 75 L62 75 L50 48 L38 75 L25 75 Z' fill='%237c9cff'/%3E%3C/svg%3E",sizes:"192x192",type:"image/svg+xml"}]
  };
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  $('#manifestLink').href=URL.createObjectURL(blob);
}
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  try{
    const swCode=`self.addEventListener('install',e=>self.skipWaiting());
      self.addEventListener('activate',e=>self.clients.claim());
      self.addEventListener('fetch',e=>{});`;
    const blob=new Blob([swCode],{type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }catch(e){}
}

async function init(){
  try{
  initFirebase();
  setTimeout(initFirebase, 1500);
  // wire create button even if App object is late
  const btn=$('#btnCreateUser');
  if(btn) btn.onclick=function(){ try{ createUser(); }catch(e){ const er=$('#authErr'); if(er){er.style.display='block';er.textContent=String(e.message||e);} console.error(e); } };
  buildManifest();
  registerSW();
  $('#fabBtn')&&$('#fabBtn').addEventListener('click',openQuickAdd);
  $('#topSearchBtn').addEventListener('click',()=>go('search'));
  $('#mobSearchBtn').addEventListener('click',()=>go('search'));
  $('#topThemeBtn').addEventListener('click',cycleTheme);
  $('#mobThemeBtn').addEventListener('click',cycleTheme);
  $('#flCloseBtn').addEventListener('click',closeFocusOverlay);
  $('#flPauseBtn').addEventListener('click',togglePauseFocus);
  $('#flSkipBtn').addEventListener('click',skipFocusPhase);
  $('#flEndBtn').addEventListener('click',endFocusSession);
  let resizeDebounce=null;
  window.addEventListener('resize',()=>{
    clearTimeout(resizeDebounce);
    resizeDebounce=setTimeout(()=>{ if(currentPage==='analytics'&&state) drawAllCharts(); if(currentPage==='home'&&state) drawHomeCharts(); },150);
  });
  // Auto-login if session exists
  if(currentUid && getUsers().some(u=>u.uid===currentUid)){
    await loadUserState(currentUid);
    applyTheme(); applyAccent(); applySurface();
    hideAuth();
    recalcStreak(); __lastKnownLevel=computeXP().level; checkAchievements();
    const hash=location.hash.replace('#','');
    if(hash && (NAV_ITEMS.some(n=>n.id===hash)||MORE_ITEMS.some(n=>n.id===hash))) currentPage=hash;
    render();
    if(state.pomodoro?.active){ clearInterval(focusInterval); focusInterval=setInterval(tickFocus,500); }
  } else {
    currentUid=''; localStorage.removeItem(SESSION_KEY);
    applyTheme(); applyAccent(); applySurface();
    showAuth(getUsers().length?'login':'create');
  }
  setInterval(()=>{ if(state) recalcStreak(); },60000);
  }catch(e){
    console.error('Init failed',e);
    const er=$('#authErr'); if(er){er.style.display='block';er.textContent='Error: '+(e.message||e);}
  }
}
function cycleTheme(){
  if(!state || !state.profile) return;
  const order=['dark','light','system'];
  const idx=order.indexOf(state.profile.theme||'dark');
  setTheme(order[(idx+1)%order.length]);
}
